<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380" font-family="sans-serif" font-size="13">
  <!-- Links -->
  <line x1="410" y1="90" x2="450" y2="140" stroke="#666" stroke-width="1"/>
  <line x1="410" y1="310" x2="450" y2="300" stroke="#666" stroke-width="1"/>
  <line x1="250" y1="100" x2="200" y2="100" stroke="#666" stroke-width="1"/>
  <line x1="250" y1="320" x2="200" y2="320" stroke="#666" stroke-width="1"/>
  <line x1="650" y1="140" x2="690" y2="100" stroke="#666" stroke-width="1"/>
  <line x1="650" y1="300" x2="690" y2="320" stroke="#666" stroke-width="1"/>
  <line x1="850" y1="100" x2="900" y2="100" stroke="#666" stroke-width="1"/>
  <line x1="850" y1="320" x2="900" y2="320" stroke="#666" stroke-width="1"/>

  <!-- titles -->
  <rect x="450" y="120" width="200" height="200" rx="6" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="550" y="141" text-anchor="middle" font-weight="bold">titles</text>
  <line x1="450" y1="152" x2="650" y2="152" stroke="#185FA5"/>
  <text x="460" y="168">show_id (PK)</text>
  <text x="460" y="184">type</text>
  <text x="460" y="200">title</text>
  <text x="460" y="216">release_year</text>
  <text x="460" y="232">rating</text>
  <text x="460" y="248">date_added</text>
  <text x="460" y="264">duration_mins</text>
  <text x="460" y="280">duration_seasons</text>
  <text x="460" y="296">description</text>

  <!-- countries -->
  <rect x="20" y="60" width="180" height="70" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="110" y="80" text-anchor="middle" font-weight="bold">countries</text>
  <line x1="20" y1="92" x2="200" y2="92" stroke="#534AB7"/>
  <text x="30" y="110">country_id (PK)</text>
  <text x="30" y="126">country</text>

  <!-- genres -->
  <rect x="20" y="280" width="180" height="70" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="110" y="300" text-anchor="middle" font-weight="bold">genres</text>
  <line x1="20" y1="312" x2="200" y2="312" stroke="#534AB7"/>
  <text x="30" y="330">genre_id (PK)</text>
  <text x="30" y="346">genre</text>

  <!-- title_countries -->
  <rect x="250" y="60" width="160" height="70" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="330" y="80" text-anchor="middle" font-weight="bold">title_countries</text>
  <line x1="250" y1="92" x2="410" y2="92" stroke="#0F6E56"/>
  <text x="260" y="110">show_id (FK)</text>
  <text x="260" y="126">country_id (FK)</text>

  <!-- title_genres -->
  <rect x="250" y="280" width="160" height="70" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="330" y="300" text-anchor="middle" font-weight="bold">title_genres</text>
  <line x1="250" y1="312" x2="410" y2="312" stroke="#0F6E56"/>
  <text x="260" y="330">show_id (FK)</text>
  <text x="260" y="346">genre_id (FK)</text>

  <!-- title_cast -->
  <rect x="690" y="60" width="160" height="70" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="770" y="80" text-anchor="middle" font-weight="bold">title_cast</text>
  <line x1="690" y1="92" x2="850" y2="92" stroke="#0F6E56"/>
  <text x="700" y="110">show_id (FK)</text>
  <text x="700" y="126">cast_id (FK)</text>

  <!-- title_directors -->
  <rect x="690" y="280" width="160" height="70" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="770" y="300" text-anchor="middle" font-weight="bold">title_directors</text>
  <line x1="690" y1="312" x2="850" y2="312" stroke="#0F6E56"/>
  <text x="700" y="330">show_id (FK)</text>
  <text x="700" y="346">director_id (FK)</text>

  <!-- cast_members -->
  <rect x="900" y="60" width="180" height="70" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="990" y="80" text-anchor="middle" font-weight="bold">cast_members</text>
  <line x1="900" y1="92" x2="1080" y2="92" stroke="#534AB7"/>
  <text x="910" y="110">cast_id (PK)</text>
  <text x="910" y="126">name</text>

  <!-- directors -->
  <rect x="900" y="280" width="180" height="70" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="990" y="300" text-anchor="middle" font-weight="bold">directors</text>
  <line x1="900" y1="312" x2="1080" y2="312" stroke="#534AB7"/>
  <text x="910" y="330">director_id (PK)</text>
  <text x="910" y="346">name</text>
</svg>
